<!-- =============================================
     TELA PRINCIPAL — TCC SISTEMA TÊXTIL
     Agora é a primeira página do site (login opcional)
     ============================================= -->

<div class="pagina-wrapper">

  <!-- ===== NAVBAR ===== -->
  <header class="navbar">
    <div class="navbar-logo">
      <span class="logo-texto">URBAN VILUZ</span>
    </div>

    <!-- Botões que rolam a pagina ate a secao da estacao.
         Usei <button> (e não <a>) porque botão de verdade funciona
         com a tecla Tab e com leitor de tela -->
    <nav class="navbar-nav">
      <button (click)="scrollTo('outono')"    class="nav-link">OUTONO</button>
      <button (click)="scrollTo('inverno')"   class="nav-link">INVERNO</button>
      <button (click)="scrollTo('primavera')" class="nav-link">PRIMAVERA</button>
      <button (click)="scrollTo('verao')"     class="nav-link">VERÃO</button>
      <a routerLink="/catalogo"               class="nav-link">CATÁLOGO</a>
    </nav>

    <div class="navbar-acoes">

      <!-- Botão que alterna entre modo claro e escuro -->
      <button class="btn-tema" (click)="tema.alternarTema()"
        [attr.aria-label]="tema.escuro ? 'Mudar para modo claro' : 'Mudar para modo escuro'"
        [title]="tema.escuro ? 'Mudar para modo claro' : 'Mudar para modo escuro'">
        {{ tema.escuro ? '☀' : '☾' }}
      </button>

      <!-- Link do carrinho com o contador de itens -->
      <a routerLink="/carrinho" class="nav-link nav-carrinho">
        CARRINHO
        <!-- a bolinha verde só aparece se tiver item no carrinho -->
        <span class="carrinho-badge" *ngIf="carrinho.totalItens() > 0">{{ carrinho.totalItens() }}</span>
      </a>

      <!-- área interna da fábrica: o link só aparece pra quem fez login -->
      <a routerLink="/movimentacao" class="nav-link" *ngIf="usuario.estaLogado()">MOVIMENTAÇÃO</a>

      <!-- Se tiver alguém logado mostra o nome + SAIR,
           senão mostra o botão ENTRAR (login é opcional) -->
      <ng-container *ngIf="usuario.estaLogado(); else botaoEntrar">
        <span class="usuario-label">{{ usuario.nomeUsuario }}</span>
        <button class="btn-sair" (click)="sair()">SAIR</button>
      </ng-container>
      <ng-template #botaoEntrar>
        <button class="btn-entrar-nav" (click)="irParaLogin()">ENTRAR</button>
      </ng-template>

    </div>
  </header>

  <!-- <main> marca o conteúdo principal da página (acessibilidade) -->
  <main>

  <!-- ===== HERO COM IMAGEM DE FUNDO ===== -->
  <!-- A imagem fica no CSS (.hero background-image) -->
  <section class="hero">
    <div class="hero-overlay"></div>
    <div class="hero-conteudo">
      <p class="hero-eyebrow">COLEÇÕES 2026</p>
      <h1 class="hero-titulo">NOVA<br>TEMPORADA</h1>
      <p class="hero-subtitulo">
        Explore as linhas sazonais da nossa coleção têxtil
      </p>
      <div class="hero-linha"></div>
    </div>
  </section>

  <!-- ===== GRID DE COLEÇÕES ===== -->
  <section class="colecoes" id="colecoes">

    <div class="colecoes-header">
      <h2 class="colecoes-titulo">ESTAÇÕES</h2>
      <!-- Atalho pro catálogo completo, do lado do grid de coleções -->
      <a routerLink="/catalogo" class="link-catalogo">VER CATÁLOGO COMPLETO →</a>
    </div>

    <div class="colecoes-grid">

      <!-- Percorro o array de colecoes com ngFor -->
      <div
        class="colecao-card"
        *ngFor="let col of colecoes"
        [id]="col.rota"
        (mouseenter)="ativarCard(col.id)"
        (mouseleave)="desativarCard()"
        [class.card-ativo]="cardAtivo === col.id"
        (click)="irParaColecao(col.rota)"
        style="cursor: pointer"
      >
        <!-- Imagem da estacao com filtro preto e branco pelo CSS -->
        <div
          class="card-imagem"
          [style.background-image]="'url(' + col.imagem + ')'"
        >
          <span class="card-numero">0{{ col.id }}</span>
        </div>

        <div class="card-info">
          <h3 class="card-estacao">{{ col.estacao }}</h3>
          <p class="card-descricao">{{ col.descricao }}</p>
          <!-- routerLink navega pra /colecao/verao etc -->
          <a class="card-link" [routerLink]="['/colecao', col.rota]">VER COLEÇÃO →</a>
        </div>

      </div>

    </div>

  </section>

  </main>

  <!-- ===== RODAPÉ (componente compartilhado com as redes sociais) ===== -->
  <app-rodape></app-rodape>

</div>
