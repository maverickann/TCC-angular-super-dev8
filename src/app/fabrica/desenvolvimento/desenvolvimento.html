<main class="container">
  <app-fabrica-header pageTitle="Desenvolvimento"></app-fabrica-header>

  <section class="formulario" aria-labelledby="titulo-dados-peca">
    <div class="formulario-cabecalho">
      <p class="etapa">Cadastro técnico</p>
      <h2 id="titulo-dados-peca">Dados da peça</h2>
      <p>Preencha as informações de desenvolvimento do novo produto.</p>
    </div>

    <div class="form-grid">
      <div class="campo campo-destaque">
        <label for="nome">Nome da peça</label>
        <input type="text" id="nome">
      </div>

      <div class="campo">
        <label for="of">OF</label>
        <input type="number" id="of" min="1">
      </div>

      <div class="campo">
        <label for="referencia">Referência</label>
        <input type="text" id="referencia">
      </div>

      <div class="campo">
        <label for="categoria">Categoria</label>
        <input type="text" id="categoria">
      </div>

      <div class="campo">
        <label for="colecao">Coleção</label>
        <input type="text" id="colecao">
      </div>

      <div class="campo">
        <label for="gramatura">Gramatura</label>
        <input type="text" id="gramatura">
      </div>

      <div class="campo">
        <label for="cor">Cores a serem utilizadas</label>
        <input type="text" id="cor">
      </div>

      <div class="campo campo-destaque">
        <label for="fornecedores">Fornecedores</label>
        <input type="text" id="fornecedores">
       
      </div>
    </div>
  </section>
</main>
