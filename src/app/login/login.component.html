<!-- =============================================
     TELA DE LOGIN — TCC SISTEMA TÊXTIL
     ============================================= -->

<!-- <main> marca o conteúdo principal da página (acessibilidade) -->
<main class="login-page">

  <!-- Botão de tema flutuante (modo claro/escuro também no login) -->
  <button class="btn-tema-login" (click)="tema.alternarTema()"
    [attr.aria-label]="tema.escuro ? 'Mudar para modo claro' : 'Mudar para modo escuro'"
    [title]="tema.escuro ? 'Mudar para modo claro' : 'Mudar para modo escuro'">
    {{ tema.escuro ? '☀' : '☾' }}
  </button>

  <!-- Lado esquerdo: imagem/decoração -->
  <div class="login-panel-esquerdo">
    <div class="painel-conteudo">
      <div class="painel-linha"></div>
      <p class="painel-label">GESTÃO TÊXTIL</p>
      <h2 class="painel-titulo">A qualidade<br>começa no<br>detalhe.</h2>
      <div class="painel-linha"></div>
    </div>
  </div>

  <!-- Lado direito: formulário -->
  <div class="login-panel-direito">
    <div class="login-card">

      <!-- Identidade visual do sistema -->
      <div class="brand">
        <h1 class="brand-nome">TESSILE</h1>
        <p class="brand-sub">SISTEMA DE GESTÃO</p>
      </div>

      <!-- Formulário de login.
           Usar a tag <form> de verdade faz a tecla Enter enviar o login -->
      <form class="form-wrapper" (ngSubmit)="fazerLogin()">

        <!-- Campo de usuário -->
        <div class="campo">
          <label for="usuario">USUÁRIO</label>
          <input type="text" id="usuario" name="usuario" [(ngModel)]="usuario" placeholder="Seu usuário"
            autocomplete="off" />
        </div>

        <!-- Campo de senha com botão pra mostrar/esconder -->
        <div class="campo">
          <label for="senha">SENHA</label>
          <div class="input-senha-wrapper">
            <input [type]="mostrarSenha ? 'text' : 'password'" id="senha" name="senha" [(ngModel)]="senha"
              placeholder="••••••••" />
            <!-- Botão de mostrar/esconder senha.
                 O aria-label diz ao leitor de tela o que o botão faz -->
            <button type="button" class="btn-olho" (click)="alternarSenha()"
              [attr.aria-label]="mostrarSenha ? 'Ocultar senha' : 'Mostrar senha'"
              [title]="mostrarSenha ? 'Ocultar senha' : 'Mostrar senha'">
              {{ mostrarSenha ? '○' : '●' }}
            </button>
          </div>
        </div>

        <!-- Mensagem de erro: só aparece quando tem algo escrito -->
        <div class="erro-wrapper" *ngIf="mensagemErro">
          <span class="erro-icone">—</span>
          <p class="erro-texto">{{ mensagemErro }}</p>
        </div>

        <!-- Botão de login (type=submit envia o formulário) -->
        <button type="submit" class="btn-entrar">
          ENTRAR
        </button>

        <!-- O login é opcional: dá pra voltar e navegar sem entrar -->
        <a class="link-voltar" routerLink="/home">← CONTINUAR SEM LOGIN</a>

      </form>

      <!-- Rodapé discreto -->
      <p class="login-footer">TCC · Engenharia Têxtil · 2026</p>

    </div>
  </div>

</main>
